<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Rider Registration - Apna Bazaar</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}body{min-height:100vh;padding:30px 16px;background:linear-gradient(135deg,#effff4,#fff5ec)}.card{width:100%;max-width:760px;margin:auto;background:#fff;border-radius:22px;padding:34px;box-shadow:0 15px 45px rgba(0,0,0,.12)}h1{text-align:center;color:#07883f;font-size:32px}.sub{text-align:center;color:#666;margin:8px 0 28px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.full{grid-column:1/-1}label{display:block;margin-bottom:7px;font-weight:700;color:#333}input{width:100%;padding:13px;border:1px solid #ddd;border-radius:10px;font-size:15px;outline:none}input:focus{border-color:#07883f}.hint{font-size:12px;color:#777;margin-top:5px}button{width:100%;padding:15px;border:0;border-radius:10px;background:#ff6500;color:#fff;font-size:16px;font-weight:700;cursor:pointer;margin-top:22px}button:disabled{opacity:.6}#message{text-align:center;margin-top:18px;font-weight:700;line-height:1.5}.links{text-align:center;margin-top:20px}.links a{color:#07883f;font-weight:700;text-decoration:none}@media(max-width:650px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.card{padding:25px 20px}}
</style></head><body><div class="card"><h1>Apna Bazaar</h1><p class="sub">Rider Registration</p>
<div class="grid">
<div><label>Full Name</label><input id="name" required></div><div><label>Phone Number</label><input id="phone" type="tel" required></div>
<div><label>Email Address</label><input id="email" type="email" required></div><div><label>Vehicle Number</label><input id="vehicle" required></div>
<div><label>CNIC Number</label><input id="cnic" placeholder="XXXXX-XXXXXXX-X" required></div><div><label>Password</label><input id="password" type="password" minlength="6" required></div>
<div><label>Profile Photo</label><input id="profilePhoto" type="file" accept="image/*" required><div class="hint">Clear face photo</div></div>
<div><label>CNIC Photo</label><input id="cnicPhoto" type="file" accept="image/*" required><div class="hint">Clear CNIC image</div></div>
</div><button id="registerBtn" onclick="registerRider()">Submit Rider Registration</button><div id="message"></div><div class="links"><a href="rider-login.html">Already registered? Rider Login</a></div></div>
<script>
const SUPABASE_URL='https://sdycertdcrcxuygunlgf.supabase.co';
const SUPABASE_KEY='sb_publishable_IwpL3sk7-mkC65RsO5IX0Q_yn7iMqSO';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
function show(t,c){const m=document.getElementById('message');m.textContent=t;m.style.color=c}
async function uploadImage(file,userId,type){const ext=(file.name.split('.').pop()||'jpg').toLowerCase();const path=userId+'/'+type+'-'+Date.now()+'.'+ext;const {error}=await sb.storage.from('rider-documents').upload(path,file,{upsert:false});if(error)throw error;const {data}=sb.storage.from('rider-documents').getPublicUrl(path);return data.publicUrl}
async function registerRider(){
 const btn=document.getElementById('registerBtn');const full_name=document.getElementById('name').value.trim(),phone=document.getElementById('phone').value.trim(),email=document.getElementById('email').value.trim(),vehicle_number=document.getElementById('vehicle').value.trim(),cnic_number=document.getElementById('cnic').value.trim(),password=document.getElementById('password').value,profile=document.getElementById('profilePhoto').files[0],cnicPhoto=document.getElementById('cnicPhoto').files[0];
 if(!full_name||!phone||!email||!vehicle_number||!cnic_number||!password||!profile||!cnicPhoto){show('Please complete all fields and photos.','red');return}if(password.length<6){show('Password kam az kam 6 characters ka hona chahiye.','red');return}
 btn.disabled=true;show('Rider account create ho raha hai...','#555');
 try{
  const {data,error}=await sb.auth.signUp({email,password,options:{data:{account_type:'rider',full_name}}});if(error)throw error;if(!data.user)throw new Error('Rider user create nahi hua.');
  const profile_photo_url=await uploadImage(profile,data.user.id,'profile');const cnic_photo_url=await uploadImage(cnicPhoto,data.user.id,'cnic');
  const {error:insertError}=await sb.from('riders').insert({id:data.user.id,full_name,phone,cnic_number,cnic_photo_url,profile_photo_url,vehicle_number,approval_status:'pending',is_active:false,is_online:false});if(insertError)throw insertError;
  await sb.auth.signOut();show('Registration submit ho gayi. Admin approval ke baad aap login kar sakenge.','#07883f');btn.textContent='Registration Submitted';
 }catch(e){show('Registration error: '+e.message,'red');btn.disabled=false}
}
</script></body></html>
