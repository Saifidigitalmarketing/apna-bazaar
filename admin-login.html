<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Login - Apna Bazaar</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg,#eefaf2,#fff7ed);
    padding:20px;
}

.admin-login-box{
    width:100%;
    max-width:430px;
    background:#fff;
    padding:38px 35px;
    border-radius:18px;
    box-shadow:0 12px 35px rgba(0,0,0,0.12);
}

.admin-icon{
    width:65px;
    height:65px;
    margin:0 auto 15px;
    border-radius:50%;
    background:#07883f;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:30px;
}

h1{
    text-align:center;
    color:#07883f;
    font-size:30px;
    margin-bottom:8px;
}

.subtitle{
    text-align:center;
    color:#666;
    margin-bottom:30px;
}

label{
    display:block;
    font-weight:700;
    margin-bottom:8px;
    color:#333;
}

input{
    width:100%;
    padding:14px 15px;
    margin-bottom:20px;
    border:1px solid #d7d7d7;
    border-radius:9px;
    font-size:16px;
    outline:none;
}

input:focus{
    border-color:#07883f;
    box-shadow:0 0 0 3px rgba(7,136,63,0.10);
}

.login-btn{
    width:100%;
    padding:15px;
    border:none;
    border-radius:9px;
    background:#ff6b00;
    color:white;
    font-size:17px;
    font-weight:700;
    cursor:pointer;
}

.login-btn:hover{
    background:#e95f00;
}

#message{
    margin-top:16px;
    text-align:center;
    font-size:14px;
    min-height:20px;
}

.back-link{
    display:block;
    text-align:center;
    margin-top:22px;
    color:#07883f;
    text-decoration:none;
    font-weight:700;
}
</style>
</head>

<body>

<div class="admin-login-box">

    <div class="admin-icon">🔐</div>

    <h1>Admin Login</h1>

    <p class="subtitle">
        Apna Bazaar Administration
    </p>

    <label>Email Address</label>
    <input
        type="email"
        id="adminEmail"
        placeholder="Enter admin email"
    >

    <label>Password</label>
    <input
        type="password"
        id="adminPassword"
        placeholder="Enter password"
    >

    <button
        class="login-btn"
        onclick="adminLogin()"
    >
        Login to Admin Panel
    </button>

    <div id="message"></div>

    <a href="index.html" class="back-link">
        ← Back to Apna Bazaar
    </a>

</div>


<script>

const SUPABASE_URL =
"https://sdycertdcrcxuygunlgf.supabase.co";

const SUPABASE_KEY =
"sb_publishable_IwpL3sk7-mkC65RsO5IX0Q_yn7iMqSO";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

const ADMIN_EMAIL =
"saifyounas112@gmail.com";


async function adminLogin(){

    const email =
    document
    .getElementById("adminEmail")
    .value
    .trim();

    const password =
    document
    .getElementById("adminPassword")
    .value;

    const message =
    document.getElementById("message");


    if(!email || !password){

        message.style.color="red";

        message.textContent =
        "Please enter email and password.";

        return;
    }


    if(
        email.toLowerCase() !==
        ADMIN_EMAIL.toLowerCase()
    ){

        message.style.color="red";

        message.textContent =
        "You are not authorized as admin.";

        return;
    }


    message.style.color="#555";

    message.textContent =
    "Logging in...";


    const { data, error } =
    await supabaseClient.auth
    .signInWithPassword({
        email:email,
        password:password
    });


    if(error){

        message.style.color="red";

        message.textContent =
        error.message;

        return;
    }


    if(
        !data.user ||
        data.user.email.toLowerCase() !==
        ADMIN_EMAIL.toLowerCase()
    ){

        await supabaseClient.auth.signOut();

        message.style.color="red";

        message.textContent =
        "Admin access denied.";

        return;
    }


    message.style.color="#07883f";

    message.textContent =
    "Admin login successful!";


    setTimeout(function(){

        window.location.href =
        "admin.html";

    },700);

}

</script>

</body>
</html>
