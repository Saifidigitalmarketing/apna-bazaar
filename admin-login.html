<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Admin Login - Apna Bazaar</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:Arial,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#eefaf2,#fff7ed);padding:20px}.admin-login-box{width:100%;max-width:430px;background:#fff;padding:38px 35px;border-radius:18px;box-shadow:0 12px 35px rgba(0,0,0,.12)}.admin-icon{width:65px;height:65px;margin:0 auto 15px;border-radius:50%;background:#07883f;color:#fff;display:flex;align-items:center;justify-content:center;font-size:30px}h1{text-align:center;color:#07883f;font-size:30px;margin-bottom:8px}.subtitle{text-align:center;color:#666;margin-bottom:30px}label{display:block;font-weight:700;margin-bottom:8px;color:#333}input{width:100%;padding:14px 15px;margin-bottom:12px;border:1px solid #d7d7d7;border-radius:9px;font-size:16px;outline:none}input:focus{border-color:#07883f;box-shadow:0 0 0 3px rgba(7,136,63,.1)}.login-btn{width:100%;padding:15px;border:none;border-radius:9px;background:#ff6b00;color:#fff;font-size:17px;font-weight:700;cursor:pointer;margin-top:14px}.forgot-btn{display:block;width:100%;border:0;background:transparent;color:#07883f;text-align:right;font-weight:700;cursor:pointer;font-size:14px;padding:2px 0 4px}.login-btn:disabled,.forgot-btn:disabled{opacity:.6;cursor:not-allowed}#message{margin-top:16px;text-align:center;font-size:14px;min-height:20px;line-height:1.5}.back-link{display:block;text-align:center;margin-top:22px;color:#07883f;text-decoration:none;font-weight:700}
</style></head><body>
<div class="admin-login-box"><div class="admin-icon">🔐</div><h1>Admin Login</h1><p class="subtitle">Apna Bazaar Administration</p>
<label>Email Address</label><input type="email" id="adminEmail" placeholder="Enter admin email" autocomplete="username">
<label>Password</label><input type="password" id="adminPassword" placeholder="Enter password" autocomplete="current-password">
<button class="forgot-btn" id="forgotBtn" onclick="forgotPassword()">Forgot Password?</button>
<button class="login-btn" id="loginBtn" onclick="adminLogin()">Login to Admin Panel</button><div id="message"></div><a href="index.html" class="back-link">← Back to Apna Bazaar</a></div>
<script>
const SUPABASE_URL='https://sdycertdcrcxuygunlgf.supabase.co';
const SUPABASE_KEY='sb_publishable_IwpL3sk7-mkC65RsO5IX0Q_yn7iMqSO';
const supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const ADMIN_EMAIL='saifyounas112@gmail.com';
const RESET_URL='https://saifidigitalmarketing.github.io/apna-bazaar/reset-password.html?type=admin';
function msg(text,color){const m=document.getElementById('message');m.style.color=color;m.textContent=text;}
async function adminLogin(){const email=document.getElementById('adminEmail').value.trim(),password=document.getElementById('adminPassword').value;if(!email||!password){msg('Please enter email and password.','red');return}if(email.toLowerCase()!==ADMIN_EMAIL.toLowerCase()){msg('You are not authorized as admin.','red');return}msg('Logging in...','#555');const {data,error}=await supabaseClient.auth.signInWithPassword({email,password});if(error){msg(error.message,'red');return}if(!data.user||data.user.email.toLowerCase()!==ADMIN_EMAIL.toLowerCase()){await supabaseClient.auth.signOut();msg('Admin access denied.','red');return}msg('Admin login successful!','#07883f');setTimeout(()=>location.href='admin.html',700)}
async function forgotPassword(){let email=document.getElementById('adminEmail').value.trim();if(!email)email=ADMIN_EMAIL;if(email.toLowerCase()!==ADMIN_EMAIL.toLowerCase()){msg('Admin email use karein: '+ADMIN_EMAIL,'red');return}const btn=document.getElementById('forgotBtn');btn.disabled=true;msg('Password reset email bhej rahe hain...','#555');const {error}=await supabaseClient.auth.resetPasswordForEmail(email,{redirectTo:RESET_URL});btn.disabled=false;if(error){msg('Reset error: '+error.message,'red');return}msg('Reset email sent. Gmail mein latest email open karein.','#07883f')}
document.getElementById('adminPassword').addEventListener('keydown',e=>{if(e.key==='Enter')adminLogin()});
</script></body></html>
