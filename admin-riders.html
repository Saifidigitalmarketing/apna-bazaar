<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rider Management - Apna Bazaar</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7f5;color:#222}.head{background:#087a3e;color:#fff;padding:18px 24px;display:flex;justify-content:space-between;align-items:center}.head h1{margin:0;font-size:23px}.wrap{max-width:1200px;margin:25px auto;padding:0 15px}.box,.stat{background:#fff;border-radius:14px;padding:20px;box-shadow:0 4px 16px #00000012}.box{margin-bottom:18px}.box h2{color:#087a3e;margin:0 0 12px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px}.stat strong{display:block;color:#087a3e;font-size:28px;margin-top:7px}.btn{border:0;border-radius:8px;padding:10px 13px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block}.back{background:#ff6500;color:#fff}.approve{background:#087a3e;color:#fff}.reject{background:#d93636;color:#fff}.refresh{background:#e9efeb;color:#222}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.filters button{border:1px solid #dce5df;background:#fff;border-radius:8px;padding:9px 12px;font-weight:700;cursor:pointer}.filters button.active{background:#087a3e;color:#fff}.rider{border:1px solid #dde6e0;border-radius:12px;padding:16px;margin-top:12px;display:grid;grid-template-columns:80px 1fr auto;gap:16px;align-items:center}.photo{width:75px;height:75px;border-radius:50%;object-fit:cover;background:#eef3f0}.name{font-size:18px;font-weight:800;color:#087a3e;margin-bottom:7px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px;line-height:1.5;font-size:14px}.actions{display:flex;flex-direction:column;gap:7px;min-width:120px}.actions a{text-align:center;background:#eef3f0;color:#222}.badge{display:inline-block;padding:4px 8px;border-radius:20px;font-size:12px;text-transform:capitalize}.pending{background:#fff3cd;color:#806000}.approved{background:#dff6e7;color:#087a3e}.rejected{background:#fde2e2;color:#b42318}.msg{padding:16px;background:#f7faf8;border-radius:9px;text-align:center}.error{color:#b42318}@media(max-width:650px){.stats,.grid{grid-template-columns:1fr}.rider{grid-template-columns:65px 1fr}.photo{width:60px;height:60px}.actions{grid-column:1/-1;flex-direction:row}.actions>*{flex:1}.head{padding:14px}}</style></head><body><header class="head"><div><h1>Apna Bazaar Admin</h1><small>Rider Requests & Management</small></div><a class="btn back" href="admin.html">Back to Admin</a></header><main class="wrap"><div class="stats"><div class="stat">Pending Requests<strong id="pendingCount">0</strong></div><div class="stat">Approved Riders<strong id="approvedCount">0</strong></div><div class="stat">Online Riders<strong id="onlineCount">0</strong></div></div><section class="box"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><div><h2>Rider Requests</h2><span>Review rider details, CNIC and approve or reject registration.</span></div><button class="btn refresh" onclick="loadAll()">Refresh</button></div><div class="filters"><button class="active" data-f="all">All</button><button data-f="pending">Pending</button><button data-f="approved">Approved</button><button data-f="rejected">Rejected</button></div><div id="message"></div><div id="list"><div class="msg">Loading...</div></div></section></main><script>const U='https://sdycertdcrcxuygunlgf.supabase.co',K='sb_publishable_IwpL3sk7-mkC65RsO5IX0Q_yn7iMqSO',db=supabase.createClient(U,K),ADMIN='saifyounas112@gmail.com';let riders=[],filter='all';function e(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}async function protect(){const {data:{user}}=await db.auth.getUser();if(!user||String(user.email).toLowerCase()!==ADMIN){location.replace('admin-login.html');return false}return true}async function loadAll(){if(!await protect())return;const list=document.getElementById('list');list.innerHTML='<div class="msg">Loading...</div>';const r=await db.from('riders').select('id,full_name,phone,cnic_number,cnic_photo_url,profile_photo_url,vehicle_number,approval_status,is_active,is_online,created_at,approved_at').order('created_at',{ascending:false});if(r.error){list.innerHTML='<div class="msg error">Riders load error: '+e(r.error.message)+'</div>';return}riders=r.data||[];render()}function render(){document.getElementById('pendingCount').textContent=riders.filter(r=>(r.approval_status||'pending')==='pending').length;document.getElementById('approvedCount').textContent=riders.filter(r=>r.approval_status==='approved').length;document.getElementById('onlineCount').textContent=riders.filter(r=>r.approval_status==='approved'&&r.is_online).length;const a=filter==='all'?riders:riders.filter(r=>(r.approval_status||'pending')===filter);const list=document.getElementById('list');if(!a.length){list.innerHTML='<div class="msg">No riders found.</div>';return}list.innerHTML=a.map(r=>{const s=r.approval_status||'pending';return `<article class="rider"><img class="photo" src="${e(r.profile_photo_url||'')}" alt="Profile" onerror="this.style.visibility='hidden'"><div><div class="name">${e(r.full_name||'Unnamed')} <span class="badge ${e(s)}">${e(s)}</span></div><div class="grid"><span><b>Phone:</b> ${e(r.phone||'-')}</span><span><b>Vehicle:</b> ${e(r.vehicle_number||'-')}</span><span><b>CNIC:</b> ${e(r.cnic_number||'-')}</span><span><b>Online:</b> ${r.is_online?'Yes':'No'}</span></div></div><div class="actions">${r.cnic_photo_url?`<a class="btn" href="${e(r.cnic_photo_url)}" target="_blank" rel="noopener">View CNIC</a>`:''}${s!=='approved'?`<button class="btn approve" onclick="setStatus('${r.id}','approved')">Approve</button>`:''}${s!=='rejected'?`<button class="btn reject" onclick="setStatus('${r.id}','rejected')">Reject</button>`:''}</div></article>`}).join('')}async function setStatus(id,status){if(!await protect())return;const patch={approval_status:status,is_active:status==='approved',is_online:false,approved_at:status==='approved'?new Date().toISOString():null};const {error}=await db.from('riders').update(patch).eq('id',id);if(error){alert('Update failed: '+error.message);return}alert(status==='approved'?'Rider approved successfully.':'Rider rejected.');await loadAll()}document.querySelectorAll('.filters button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.filters button').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.f;render()});loadAll();</script></body></html>
