<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rider & Delivery Management - Apna Bazaar</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--green:#008a45;--green-dark:#006d37;--orange:#ff5b0a;--cream:#fffaf5;--mint:#f2fbf6;--text:#20231f;--muted:#667069;--line:#e6ece8;--shadow:0 8px 28px rgba(25,70,45,.08)}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:var(--text);background:linear-gradient(135deg,#f3fff8 0%,#fffaf5 55%,#f8fbf9 100%);min-height:100vh}.head{background:#fff;border-bottom:1px solid #edf0ee;padding:14px 5%;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10;box-shadow:0 3px 15px rgba(0,0,0,.04)}.brand{display:flex;align-items:center;gap:12px}.brand img{width:170px;max-height:52px;object-fit:contain}.brandText h1{margin:0;color:var(--green);font-size:22px}.brandText small{color:var(--muted)}.wrap{max-width:1200px;margin:28px auto;padding:0 18px}.hero{background:linear-gradient(110deg,#effff6,#fff7f0);border:1px solid #edf1ee;border-radius:20px;padding:25px 28px;margin-bottom:20px;box-shadow:var(--shadow)}.hero h2{margin:0 0 7px;color:var(--green-dark);font-size:27px}.hero p{margin:0;color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}.stat,.box{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.stat{padding:19px 20px}.stat strong{display:block;font-size:28px;margin-top:8px}.box{padding:22px;margin-bottom:18px}.btn{border:0;border-radius:10px;padding:11px 15px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.back,.primary,.approve{background:var(--orange);color:#fff}.reject{background:#fff1f0;color:#c52d26;border:1px solid #ffd5d2}.refresh{background:#f2f5f3;color:#333}.tabs,.filters{display:flex;gap:9px;flex-wrap:wrap}.tabs button,.filters button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:11px 16px;font-weight:700;cursor:pointer}.tabs button.active{background:var(--orange);color:#fff}.filters{margin:18px 0 8px}.filters button.active{background:#e8f7ef;color:var(--green-dark)}.view{display:none}.view.active{display:block}.sectionHead{display:flex;justify-content:space-between;align-items:center}.sectionHead h2{color:var(--green-dark)}.rider,.order{border:1px solid var(--line);border-radius:15px;padding:17px;margin-top:13px;background:#fff}.rider{display:grid;grid-template-columns:82px 1fr auto;gap:18px;align-items:center}.photo{width:76px;height:76px;border-radius:50%;object-fit:cover;background:var(--mint)}.name{font-size:18px;font-weight:800;margin-bottom:8px}.grid,.orderGrid{display:grid;grid-template-columns:1fr 1fr;gap:7px 18px;font-size:14px}.actions{display:flex;flex-direction:column;gap:8px;min-width:145px}.actions a{background:#f1f5f2;color:var(--green-dark);border:1px solid #e1e9e4}.badge{display:inline-block;padding:5px 9px;border-radius:20px;font-size:12px;margin-left:5px}.pending{background:#fff5d9;color:#8a6200}.approved{background:#e3f7eb;color:#087a3e}.rejected{background:#fde7e5;color:#b42318}.orderTop{display:flex;justify-content:space-between}.orderGrid{margin:14px 0}.assign{display:flex;gap:9px;flex-wrap:wrap}.assign select{min-width:220px;padding:11px;border:1px solid #ddd;border-radius:10px}.msg{padding:18px;background:#f7faf8;border-radius:10px;text-align:center;color:var(--muted)}.error{color:#b42318}@media(max-width:760px){.stats{grid-template-columns:1fr 1fr}.grid,.orderGrid{grid-template-columns:1fr}.rider{grid-template-columns:65px 1fr}.photo{width:60px;height:60px}.actions{grid-column:1/-1;flex-direction:row;flex-wrap:wrap}.actions>*{flex:1}.brand img{width:135px}.brandText{display:none}}</style></head><body><header class="head"><div class="brand"><img src="apna-bazaar-logo.png" alt="Apna Bazaar"><div class="brandText"><h1>Admin Panel</h1><small>Rider & Delivery Management</small></div></div><a class="btn back" href="admin.html">Back to Admin</a></header><main class="wrap"><section class="hero"><h2>Rider & Delivery Management</h2><p>Approve riders, check documents and manage delivery assignments.</p></section><div class="stats"><div class="stat">Pending Requests<strong id="pendingCount">0</strong></div><div class="stat">Approved Riders<strong id="approvedCount">0</strong></div><div class="stat">Online Riders<strong id="onlineCount">0</strong></div><div class="stat">Assigned Deliveries<strong id="assignedCount">0</strong></div></div><section class="box"><div class="tabs"><button class="active" data-view="requests">🛵 Rider Requests</button><button data-view="deliveries">📦 Order Assignment</button></div></section><section id="requests" class="box view active"><div class="sectionHead"><h2>Rider Requests</h2><button class="btn refresh" onclick="loadAll()">Refresh</button></div><div class="filters"><button class="active" data-f="all">All</button><button data-f="pending">Pending</button><button data-f="approved">Approved</button><button data-f="rejected">Rejected</button></div><div id="riderList"><div class="msg">Loading riders...</div></div></section><section id="deliveries" class="box view"><div class="sectionHead"><h2>Order Assignment</h2><button class="btn refresh" onclick="loadAll()">Refresh</button></div><div id="orderList"><div class="msg">Loading orders...</div></div></section></main><script>const U='https://sdycertdcrcxuygunlgf.supabase.co',K='sb_publishable_IwpL3sk7-mkC65RsO5IX0Q_yn7iMqSO',db=supabase.createClient(U,K),ADMIN='saifyounas112@gmail.com';let riders=[],orders=[],filter='all';function e(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}async function protect(){const {data:{user}}=await db.auth.getUser();if(!user||String(user.email).toLowerCase()!==ADMIN){location.replace('admin-login.html');return false}return true}async function loadAll(){if(!await protect())return;const [rr,oo]=await Promise.all([db.from('riders').select('id,full_name,phone,cnic_number,cnic_photo_url,profile_photo_url,vehicle_number,vehicle_photo_url,approval_status,is_active,is_online,created_at,approved_at').order('created_at',{ascending:false}),db.from('orders').select('*').order('id',{ascending:false})]);if(rr.error)document.getElementById('riderList').innerHTML='<div class="msg error">Riders load error: '+e(rr.error.message)+'</div>';else riders=rr.data||[];if(oo.error)document.getElementById('orderList').innerHTML='<div class="msg error">Orders load error: '+e(oo.error.message)+'</div>';else orders=oo.data||[];renderStats();renderRiders();renderOrders()}function renderStats(){pendingCount.textContent=riders.filter(r=>(r.approval_status||'pending')==='pending').length;approvedCount.textContent=riders.filter(r=>r.approval_status==='approved').length;onlineCount.textContent=riders.filter(r=>r.approval_status==='approved'&&r.is_online).length;assignedCount.textContent=orders.filter(o=>o.assigned_rider_id&&o.rider_status!=='Delivered').length}function renderRiders(){const a=filter==='all'?riders:riders.filter(r=>(r.approval_status||'pending')===filter),list=document.getElementById('riderList');if(!a.length){list.innerHTML='<div class="msg">No riders found.</div>';return}list.innerHTML=a.map(r=>{const s=r.approval_status||'pending';return `<article class="rider"><img class="photo" src="${e(r.profile_photo_url||'')}" alt="Profile" onerror="this.style.visibility='hidden'"><div><div class="name">${e(r.full_name||'Unnamed')} <span class="badge ${e(s)}">${e(s)}</span></div><div class="grid"><span><b>Phone:</b> ${e(r.phone||'-')}</span><span><b>Vehicle:</b> ${e(r.vehicle_number||'-')}</span><span><b>CNIC:</b> ${e(r.cnic_number||'-')}</span><span><b>Online:</b> ${r.is_online?'Yes':'No'}</span></div></div><div class="actions">${r.cnic_photo_url?`<a class="btn" href="${e(r.cnic_photo_url)}" target="_blank" rel="noopener">View CNIC</a>`:'<span class="btn reject">CNIC Missing</span>'}${r.vehicle_photo_url?`<a class="btn" href="${e(r.vehicle_photo_url)}" target="_blank" rel="noopener">View Vehicle</a>`:'<span class="btn reject">Vehicle Photo Missing</span>'}${s!=='approved'?`<button class="btn approve" onclick="setStatus('${r.id}','approved')">Approve</button>`:''}${s!=='rejected'?`<button class="btn reject" onclick="setStatus('${r.id}','rejected')">Reject</button>`:''}</div></article>`}).join('')}function renderOrders(){const list=document.getElementById('orderList'),approved=riders.filter(r=>r.approval_status==='approved'&&r.is_active);if(!orders.length){list.innerHTML='<div class="msg">No orders found.</div>';return}list.innerHTML=orders.map(o=>{const assigned=riders.find(r=>r.id===o.assigned_rider_id);return `<article class="order"><div class="orderTop"><b>Order #${e(o.id)}</b><span>${o.assigned_rider_id?'Assigned':'Not Assigned'}</span></div><div class="orderGrid"><span><b>Phone:</b> ${e(o.phone||'-')}</span><span><b>Total:</b> Rs. ${e(o.total||o.grand_total||'-')}</span><span><b>Area:</b> ${e(o.area||'-')}</span><span><b>Status:</b> ${e(o.order_status||o.status||'-')}</span><span><b>Address:</b> ${e(o.address||'-')}</span><span><b>Rider:</b> ${e(assigned?.full_name||'Not assigned')}</span></div><div class="assign"><select id="rider-${e(o.id)}"><option value="">Select Rider</option>${approved.map(r=>`<option value="${r.id}" ${o.assigned_rider_id===r.id?'selected':''}>${e(r.full_name)}</option>`).join('')}</select><button class="btn primary" onclick="assignRider('${e(o.id)}')">Assign Rider</button></div></article>`}).join('')}async function setStatus(id,status){if(!await protect())return;const r=riders.find(x=>x.id===id);if(status==='approved'&&(!r?.cnic_photo_url||!r?.vehicle_photo_url||!r?.profile_photo_url||!r?.phone||!r?.cnic_number||!r?.vehicle_number)){alert('Rider ki required details/documents missing hain. Approve nahi ho sakta.');return}const {error}=await db.from('riders').update({approval_status:status,is_active:status==='approved',is_online:false,approved_at:status==='approved'?new Date().toISOString():null}).eq('id',id);if(error){alert('Update failed: '+error.message);return}await loadAll()}async function assignRider(orderId){if(!await protect())return;const riderId=document.getElementById('rider-'+orderId).value;if(!riderId){alert('Pehle rider select karein.');return}const {error}=await db.from('orders').update({assigned_rider_id:riderId,rider_status:'Assigned',assigned_at:new Date().toISOString(),rider_status_updated_at:new Date().toISOString()}).eq('id',orderId);if(error){alert('Assignment failed: '+error.message);return}await loadAll()}document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById(b.dataset.view).classList.add('active')});document.querySelectorAll('.filters button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.filters button').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.f;renderRiders()});loadAll();</script></body></html>
