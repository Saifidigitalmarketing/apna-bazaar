<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rider Management - Apna Bazaar</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7f5;color:#222}.head{background:#087a3e;color:#fff;padding:18px 24px;display:flex;justify-content:space-between;align-items:center}.head h1{margin:0;font-size:23px}.wrap{max-width:1200px;margin:25px auto;padding:0 15px}.box,.stat{background:#fff;border-radius:14px;padding:20px;box-shadow:0 4px 16px #00000012}.box{margin-bottom:18px}.box h2{color:#087a3e;margin:0 0 12px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px}.stat strong{display:block;color:#087a3e;font-size:28px;margin-top:7px}.btn{border:0;border-radius:8px;padding:10px 13px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block}.back{background:#ff6500;color:#fff}.assign{background:#087a3e;color:#fff}.refresh{background:#e9efeb;color:#222}.order{border:1px solid #dde6e0;border-radius:12px;padding:16px;margin-top:12px}.top{display:flex;justify-content:space-between;gap:10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 20px;line-height:1.6;margin:10px 0}.assign-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}select{padding:10px;border:1px solid #ccd6cf;border-radius:8px;min-width:210px}.badge{background:#eef5f0;padding:5px 9px;border-radius:20px;font-size:13px}.msg{padding:16px;background:#f7faf8;border-radius:9px;text-align:center}.error{color:#b42318}@media(max-width:650px){.stats,.grid{grid-template-columns:1fr}.head{padding:14px}.top{flex-direction:column}.assign-row select,.assign-row .btn{width:100%}}</style></head><body><header class="head"><div><h1>Apna Bazaar Admin</h1><small>Rider & Delivery Management</small></div><a class="btn back" href="admin.html">Back to Admin</a></header><main class="wrap"><div class="stats"><div class="stat">Active Riders<strong id="riderCount">0</strong></div><div class="stat">Assigned Deliveries<strong id="assignedCount">0</strong></div><div class="stat">Delivered<strong id="deliveredCount">0</strong></div></div><section class="box"><div class="top"><div><h2>Order Assignment</h2><span>Assign customer orders to active riders and track delivery status.</span></div><button class="btn refresh" onclick="loadAll()">Refresh</button></div><div id="list"><div class="msg">Loading...</div></div></section></main><script>const U='https://sdycertdcrcxuygunlgf.supabase.co',K='sb_publishable_IwpL3sk7-mkC65RsO5IX0Q_yn7iMqSO',db=supabase.createClient(U,K),ADMIN='saifyounas112@gmail.com';let riders=[];function e(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}async function protect(){const {data:{user}}=await db.auth.getUser();if(!user||String(user.email).toLowerCase()!==ADMIN){location.replace('admin-login.html');return false}return true}async function loadAll(){if(!await protect())return;const list=document.getElementById('list');list.innerHTML='<div class="msg">Loading...</div>';const r=await db.from('riders').select('id,full_name,phone,is_active').eq('is_active',true).order('full_name');if(r.error){list.innerHTML='<div class="msg error">Riders load error: '+e(r.error.message)+'</div>';return}riders=r.data||[];document.getElementById('riderCount').textContent=riders.length;const q=await db.from('orders').select('id,created_at,customer_name,customer_phone,customer_area,customer_address,grand_total,order_status,assigned_rider_id,rider_status,assigned_at').order('id',{ascending:false});if(q.error){list.innerHTML='<div class="msg error">Orders load error: '+e(q.error.message)+'</div>';return}const orders=q.data||[];document.getElementById('assignedCount').textContent=orders.filter(o=>o.assigned_rider_id&&o.rider_status!=='Delivered').length;document.getElementById('deliveredCount').textContent=orders.filter(o=>o.rider_status==='Delivered').length;if(!orders.length){list.innerHTML='<div class="msg">No orders found.</div>';return}list.innerHTML=orders.map(o=>{const current=riders.find(r=>r.id===o.assigned_rider_id);const options='<option value="">Select Rider</option>'+riders.map(r=>`<option value="${e(r.id)}" ${r.id===o.assigned_rider_id?'selected':''}>${e(r.full_name)}</option>`).join('');return `<article class="order"><div class="top"><b>Order #${e(o.id)} — ${e(o.customer_name||'Customer')}</b><span class="badge">${e(o.rider_status||'Not Assigned')}</span></div><div class="grid"><div><b>Phone:</b> ${e(o.customer_phone||'-')}<br><b>Area:</b> ${e(o.customer_area||'-')}<br><b>Address:</b> ${e(o.customer_address||'-')}</div><div><b>Total:</b> Rs. ${e(o.grand_total||0)}<br><b>Order Status:</b> ${e(o.order_status||'Pending')}<br><b>Rider:</b> ${e(current?.full_name||'Not assigned')}</div></div><div class="assign-row"><select id="r-${o.id}">${options}</select><button class="btn assign" onclick="assign(${o.id})">Assign Rider</button></div></article>`}).join('')}async function assign(id){const riderId=document.getElementById('r-'+id).value;if(!riderId){alert('Please select a rider.');return}const {error}=await db.from('orders').update({assigned_rider_id:riderId,rider_status:'Assigned',assigned_at:new Date().toISOString(),rider_status_updated_at:new Date().toISOString()}).eq('id',id);if(error){alert('Assignment failed: '+error.message);return}alert('Rider assigned successfully.');await loadAll()}loadAll();</script></body></html>
