<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Rider Dashboard - Apna Bazaar</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#f3fff8,#fff8f1);color:#222}.header{background:#fff;padding:14px 5%;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #e8eee9}.header h1{margin:0;color:#087a3e;font-size:24px}.btn{border:0;border-radius:10px;padding:11px 14px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block}.logout,.status-btn,.accept{background:#ff6500;color:#fff}.container{max-width:1100px;margin:26px auto;padding:0 15px}.welcome,.panel,.stat,.alert{background:#fff;border-radius:16px;padding:20px;box-shadow:0 6px 22px rgba(0,70,40,.08)}.welcome{margin-bottom:18px;display:flex;justify-content:space-between;align-items:center;gap:15px}.welcome h2,.panel h2{margin:0 0 7px;color:#087a3e}.onlineBox{display:flex;align-items:center;gap:10px}.onlineBtn,.tab{background:#e9efeb;color:#333}.onlineBtn.on,.tab.active{background:#087a3e;color:#fff}.dot{width:10px;height:10px;border-radius:50%;background:#aaa}.dot.on{background:#11b85a;box-shadow:0 0 0 5px #e5f8ed}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-bottom:18px}.stat strong{display:block;font-size:30px;color:#087a3e;margin-top:8px}.alert{display:none;margin-bottom:18px;border:2px solid #ff6500;background:#fff7ef}.alert.show{display:flex;justify-content:space-between;align-items:center;gap:12px}.tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}.order{border:1px solid #dfe7e2;border-radius:13px;padding:17px;margin:13px 0;background:#fff}.order.new{border:2px solid #ff6500;background:#fffaf5}.order-head{display:flex;justify-content:space-between;gap:10px;align-items:center}.order h3{margin:0;color:#087a3e}.badge{padding:6px 9px;border-radius:20px;background:#eef5f0;font-size:13px;font-weight:700}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 20px;margin-top:13px;line-height:1.55}.items{background:#f7faf8;border-radius:9px;padding:12px;margin-top:12px}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:13px}.call{background:#087a3e;color:#fff}.map{background:#1677ff;color:#fff}.empty,.error{padding:20px;text-align:center;background:#f7faf8;border-radius:10px}.error{color:#b42318}.muted{color:#666}@media(max-width:650px){.header{padding:14px}.header h1{font-size:19px}.stats,.grid{grid-template-columns:1fr}.container{margin-top:18px}.order-head,.welcome,.alert.show{align-items:flex-start;flex-direction:column}.actions .btn{flex:1;text-align:center}.onlineBox{width:100%}.onlineBtn{flex:1}}</style></head><body><header class="header"><div><h1>Apna Bazaar Rider</h1><small id="riderHeader">Secure Rider Dashboard</small></div><button class="btn logout" onclick="logoutRider()">Logout</button></header><main class="container"><section class="welcome"><div><h2 id="welcomeTitle">Rider Dashboard</h2><div id="securityStatus" class="muted">Checking secure rider session...</div></div><div class="onlineBox"><span id="onlineDot" class="dot"></span><button id="onlineBtn" class="btn onlineBtn" onclick="toggleOnline()">Go Online</button></div></section><div id="newAlert" class="alert"><div><b>🔔 New Delivery Available!</b><div id="alertText">A new order is waiting.</div></div><button class="btn accept" onclick="setTab('available')">View Order</button></div><div class="stats"><div class="stat">Available Orders<strong id="availableCount">0</strong></div><div class="stat">Active Deliveries<strong id="activeCount">0</strong></div><div class="stat">Completed Deliveries<strong id="completedCount">0</strong></div></div><section class="panel"><h2>Deliveries</h2><div class="tabs"><button class="btn tab" id="availableTab" onclick="setTab('available')">New Orders</button><button class="btn tab active" id="activeTab" onclick="setTab('active')">My Active</button><button class="btn tab" id="doneTab" onclick="setTab('done')">Completed</button></div><div id="ordersList"><div class="empty">Loading orders...</div></div></section></main><script>const U='https://sdycertdcrcxuygunlgf.supabase.co',K='sb_publishable_IwpL3sk7-mkC65RsO5IX0Q_yn7iMqSO',db=supabase.createClient(U,K);let riderUid=null,myOrders=[],availableOrders=[],currentTab='active',isOnline=false,heartbeat=null,channel=null,lastAvailable=0;const $=id=>document.getElementById(id);function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function money(v){return Number(v||0).toLocaleString()}function itemText(items){if(!Array.isArray(items)||!items.length)return'No items';return items.map(i=>`${esc(i.name||i.product_name||'Product')} × ${esc(i.quantity||i.qty||1)} — Rs. ${money(i.price||i.product_price||0)}`).join('<br>')}function nextStatus(s){return{'Accepted':'Picked Up','Picked Up':'On The Way','On The Way':'Delivered'}[s]||null}function mapUrl(o){if(o.customer_latitude!=null&&o.customer_longitude!=null)return`https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(o.customer_latitude+','+o.customer_longitude)}`;return`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(o.customer_address||o.customer_area||'')}`}function paintOnline(){$('onlineBtn').textContent=isOnline?'Online — Tap to go Offline':'Go Online';$('onlineBtn').classList.toggle('on',isOnline);$('onlineDot').classList.toggle('on',isOnline);if(!isOnline&&currentTab==='available')setTab('active')}async function setPresence(value){if(!riderUid)return false;const{error}=await db.from('riders').update({is_online:value,last_seen_at:new Date().toISOString()}).eq('id',riderUid);if(error){alert('Online status update failed: '+error.message);return false}isOnline=value;paintOnline();if(heartbeat)clearInterval(heartbeat);if(value){heartbeat=setInterval(()=>db.from('riders').update({last_seen_at:new Date().toISOString(),is_online:true}).eq('id',riderUid),30000);await loadOrders()}else{availableOrders=[];updateCounts();render()}return true}async function toggleOnline(){await setPresence(!isOnline)}async function init(){const{data:{session}}=await db.auth.getSession();if(!session?.user){location.replace('rider-login.html');return}riderUid=session.user.id;const{data:rider,error}=await db.from('riders').select('id,full_name,is_active,approval_status,is_online').eq('id',riderUid).maybeSingle();if(error||!rider||rider.is_active!==true||rider.approval_status!=='approved'){await db.auth.signOut();location.replace('rider-login.html');return}isOnline=!!rider.is_online;paintOnline();$('welcomeTitle').textContent='Welcome, '+(rider.full_name||'Rider');$('riderHeader').textContent=rider.full_name||'Active Rider';$('securityStatus').textContent='Approved rider account verified.';await loadOrders();channel=db.channel('rider-delivery-live-'+riderUid).on('postgres_changes',{event:'*',schema:'public',table:'orders'},()=>loadOrders(true)).subscribe();if(isOnline)await setPresence(true);if('Notification'in window&&Notification.permission==='default')Notification.requestPermission().catch(()=>{})}async function loadOrders(notify=false){const cols='id,created_at,customer_name,customer_phone,customer_area,customer_address,customer_latitude,customer_longitude,distance_km,delivery_charge,subtotal,grand_total,items,order_status,rider_status,assigned_rider_id,assigned_at,rider_status_updated_at';const my=await db.from('orders').select(cols).eq('assigned_rider_id',riderUid).order('created_at',{ascending:false});if(my.error){$('ordersList').innerHTML='<div class="error">Orders load error: '+esc(my.error.message)+'</div>';return}myOrders=my.data||[];if(isOnline){const av=await db.from('orders').select(cols).is('assigned_rider_id',null).in('rider_status',['Waiting for Rider','Unassigned']).order('created_at',{ascending:false});availableOrders=av.error?[]:(av.data||[])}else availableOrders=[];if(notify&&availableOrders.length>lastAvailable){$('newAlert').classList.add('show');$('alertText').textContent='New order available — first rider to accept gets it.';if('Notification'in window&&Notification.permission==='granted')new Notification('Apna Bazaar — New Delivery',{body:'New order available. Open Rider Dashboard to accept.'})}if(!availableOrders.length)$('newAlert').classList.remove('show');lastAvailable=availableOrders.length;updateCounts();render()}function updateCounts(){$('availableCount').textContent=availableOrders.length;$('activeCount').textContent=myOrders.filter(o=>o.rider_status!=='Delivered').length;$('completedCount').textContent=myOrders.filter(o=>o.rider_status==='Delivered').length}function setTab(t){if(t==='available'&&!isOnline){alert('New orders dekhne ke liye pehle Go Online karein.');return}currentTab=t;['available','active','done'].forEach(x=>$(x+'Tab').classList.toggle('active',x===t));if(t==='available')$('newAlert').classList.remove('show');render()}function render(){let list=currentTab==='available'?availableOrders:myOrders.filter(o=>currentTab==='done'?o.rider_status==='Delivered':o.rider_status!=='Delivered');if(!list.length){$('ordersList').innerHTML='<div class="empty">'+(currentTab==='available'?(isOnline?'Abhi koi new delivery available nahi hai.':'Go Online to receive new deliveries.'):(currentTab==='done'?'Abhi koi completed delivery nahi hai.':'Abhi aap ki koi active delivery nahi hai.'))+'</div>';return}$('ordersList').innerHTML=list.map(o=>{const available=currentTab==='available',s=o.rider_status||'Waiting for Rider',next=nextStatus(s),phone=String(o.customer_phone||'').replace(/[^+\d]/g,'');return`<article class="order ${available?'new':''}"><div class="order-head"><h3>Order #${esc(o.id)}</h3><span class="badge">${available?'Available':esc(s)}</span></div><div class="grid"><div><b>Customer:</b> ${esc(o.customer_name||'-')}<br><b>Phone:</b> ${esc(o.customer_phone||'-')}<br><b>Area:</b> ${esc(o.customer_area||'-')}<br><b>Address:</b> ${esc(o.customer_address||'-')}</div><div><b>Subtotal:</b> Rs. ${money(o.subtotal)}<br><b>Delivery:</b> Rs. ${money(o.delivery_charge)}<br><b>Total:</b> Rs. ${money(o.grand_total)}<br><b>Distance:</b> ${esc(o.distance_km??'-')} KM</div></div><div class="items"><b>Order Items</b><br>${itemText(o.items)}</div><div class="actions">${available?`<button class="btn accept" onclick="claimOrder(${o.id},this)">Accept Delivery</button>`:`${phone?`<a class="btn call" href="tel:${esc(phone)}">Call Customer</a>`:''}<a class="btn map" target="_blank" rel="noopener" href="${mapUrl(o)}">Open Location</a>${next?`<button class="btn status-btn" onclick="changeStatus(${o.id},'${next}')">Mark ${esc(next)}</button>`:''}`}</div></article>`}).join('')}async function claimOrder(id,btn){if(!isOnline){alert('Please Go Online first.');return}btn.disabled=true;btn.textContent='Accepting...';const{data,error}=await db.rpc('claim_delivery_order',{p_order_id:id});if(error){alert('Order accept failed: '+error.message);await loadOrders();return}if(data!==true){alert('Ye order kisi aur rider ne pehle accept kar liya hai.');await loadOrders();return}alert('Delivery accepted successfully!');currentTab='active';await loadOrders();setTab('active')}async function changeStatus(id,status){if(!confirm('Order #'+id+' ko '+status+' mark karna hai?'))return;const{data,error}=await db.rpc('update_rider_order_status',{p_order_id:id,p_new_status:status});if(error){alert('Status update failed: '+error.message);return}if(data!==true){alert('Order update nahi hua.');return}await loadOrders()}async function logoutRider(){await setPresence(false);if(channel)await db.removeChannel(channel);await db.auth.signOut();location.replace('rider-login.html')}window.addEventListener('pagehide',()=>{if(riderUid&&isOnline)db.from('riders').update({last_seen_at:new Date().toISOString()}).eq('id',riderUid)});init();</script></body></html>
