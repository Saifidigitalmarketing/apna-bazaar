<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Rider Dashboard - Apna Bazaar</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7f5;color:#222}.header{background:#087a3e;color:#fff;padding:18px 24px;display:flex;justify-content:space-between;align-items:center}.header h1{margin:0;font-size:24px}.btn{border:0;border-radius:9px;padding:11px 14px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block}.logout{background:#ff6500;color:#fff}.container{max-width:1100px;margin:26px auto;padding:0 15px}.welcome,.panel,.stat{background:#fff;border-radius:14px;padding:20px;box-shadow:0 4px 16px rgba(0,0,0,.07)}.welcome{margin-bottom:18px}.welcome h2,.panel h2{margin:0 0 7px;color:#087a3e}.stats{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-bottom:18px}.stat strong{display:block;font-size:30px;color:#087a3e;margin-top:8px}.tabs{display:flex;gap:8px;margin-bottom:16px}.tab{background:#e9efeb;color:#333}.tab.active{background:#087a3e;color:#fff}.order{border:1px solid #dfe7e2;border-radius:13px;padding:17px;margin:13px 0;background:#fff}.order-head{display:flex;justify-content:space-between;gap:10px;align-items:center}.order h3{margin:0;color:#087a3e}.badge{padding:6px 9px;border-radius:20px;background:#eef5f0;font-size:13px;font-weight:700}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 20px;margin-top:13px;line-height:1.55}.items{background:#f7faf8;border-radius:9px;padding:12px;margin-top:12px}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:13px}.call{background:#087a3e;color:#fff}.map{background:#1677ff;color:#fff}.status-btn{background:#ff6500;color:#fff}.empty,.error{padding:20px;text-align:center;background:#f7faf8;border-radius:10px}.error{color:#b42318}.muted{color:#666}.hidden{display:none}@media(max-width:650px){.header{padding:14px}.header h1{font-size:19px}.stats,.grid{grid-template-columns:1fr}.container{margin-top:18px}.order-head{align-items:flex-start;flex-direction:column}.actions .btn{flex:1;text-align:center}}
</style>
</head>
<body>
<header class="header"><div><h1>Apna Bazaar Rider</h1><small id="riderHeader">Secure Rider Dashboard</small></div><button class="btn logout" onclick="logoutRider()">Logout</button></header>
<main class="container">
<section class="welcome"><h2 id="welcomeTitle">Rider Dashboard</h2><div id="securityStatus" class="muted">Checking secure rider session...</div></section>
<div class="stats"><div class="stat">Active Deliveries<strong id="activeCount">0</strong></div><div class="stat">Completed Deliveries<strong id="completedCount">0</strong></div></div>
<section class="panel"><h2>My Deliveries</h2><div class="tabs"><button class="btn tab active" id="activeTab" onclick="setTab('active')">Active</button><button class="btn tab" id="doneTab" onclick="setTab('done')">Completed</button></div><div id="ordersList"><div class="empty">Loading assigned orders...</div></div></section>
</main>
<script>
const SUPABASE_URL='https://sdycertdcrcxuygunlgf.supabase.co';
const SUPABASE_KEY='sb_publishable_IwpL3sk7-mkC65RsO5IX0Q_yn7iMqSO';
const supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let riderUid=null,allOrders=[],currentTab='active';
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
function money(v){return Number(v||0).toLocaleString();}
function itemText(items){if(!Array.isArray(items)||!items.length)return 'No items';return items.map(i=>`${esc(i.name||i.product_name||'Product')} × ${esc(i.quantity||i.qty||1)} — Rs. ${money(i.price||i.product_price||0)}`).join('<br>');}
function nextStatus(s){return {'Assigned':'Accepted','Accepted':'Picked Up','Picked Up':'On The Way','On The Way':'Delivered'}[s||'Assigned']||null;}
function mapUrl(o){if(o.customer_latitude!=null&&o.customer_longitude!=null)return `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(o.customer_latitude+','+o.customer_longitude)}`;return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(o.customer_address||o.customer_area||'')}`;}
async function init(){const {data:{session}}=await supabaseClient.auth.getSession();if(!session?.user){location.replace('rider-login.html');return}riderUid=session.user.id;const {data:rider,error}=await supabaseClient.from('riders').select('id,full_name,is_active').eq('id',riderUid).maybeSingle();if(error||!rider||rider.is_active!==true){await supabaseClient.auth.signOut();location.replace('rider-login.html');return}document.getElementById('welcomeTitle').textContent='Welcome, '+(rider.full_name||'Rider');document.getElementById('riderHeader').textContent=rider.full_name||'Active Rider';document.getElementById('securityStatus').textContent='Secure rider account verified.';await loadOrders();}
async function loadOrders(){const box=document.getElementById('ordersList');const {data,error}=await supabaseClient.from('orders').select('id,created_at,customer_name,customer_phone,customer_area,customer_address,customer_latitude,customer_longitude,distance_km,delivery_charge,subtotal,grand_total,items,order_status,rider_status,assigned_at,rider_status_updated_at').eq('assigned_rider_id',riderUid).order('created_at',{ascending:false});if(error){box.innerHTML='<div class="error">Orders load error: '+esc(error.message)+'</div>';return}allOrders=data||[];document.getElementById('activeCount').textContent=allOrders.filter(o=>o.rider_status!=='Delivered').length;document.getElementById('completedCount').textContent=allOrders.filter(o=>o.rider_status==='Delivered').length;render();}
function setTab(t){currentTab=t;document.getElementById('activeTab').classList.toggle('active',t==='active');document.getElementById('doneTab').classList.toggle('active',t==='done');render();}
function render(){const box=document.getElementById('ordersList');const list=allOrders.filter(o=>currentTab==='done'?o.rider_status==='Delivered':o.rider_status!=='Delivered');if(!list.length){box.innerHTML='<div class="empty">'+(currentTab==='done'?'Abhi koi completed delivery nahi hai.':'Abhi aap ko koi active order assign nahi hua.')+'</div>';return}box.innerHTML=list.map(o=>{const s=o.rider_status||'Assigned',next=nextStatus(s),phone=String(o.customer_phone||'').replace(/[^+\d]/g,'');return `<article class="order"><div class="order-head"><h3>Order #${esc(o.id)}</h3><span class="badge">${esc(s)}</span></div><div class="grid"><div><b>Customer:</b> ${esc(o.customer_name||'-')}<br><b>Phone:</b> ${esc(o.customer_phone||'-')}<br><b>Area:</b> ${esc(o.customer_area||'-')}<br><b>Address:</b> ${esc(o.customer_address||'-')}</div><div><b>Subtotal:</b> Rs. ${money(o.subtotal)}<br><b>Delivery:</b> Rs. ${money(o.delivery_charge)}<br><b>Total:</b> Rs. ${money(o.grand_total)}<br><b>Distance:</b> ${esc(o.distance_km??'-')} KM</div></div><div class="items"><b>Order Items</b><br>${itemText(o.items)}</div><div class="actions">${phone?`<a class="btn call" href="tel:${esc(phone)}">Call Customer</a>`:''}<a class="btn map" target="_blank" rel="noopener" href="${mapUrl(o)}">Open Location</a>${next?`<button class="btn status-btn" onclick="changeStatus(${o.id},'${next}')">Mark ${esc(next)}</button>`:''}</div></article>`}).join('');}
async function changeStatus(id,status){if(!confirm('Order #'+id+' ko '+status+' mark karna hai?'))return;const {error}=await supabaseClient.rpc('update_rider_order_status',{p_order_id:id,p_new_status:status});if(error){alert('Status update failed: '+error.message);return}await loadOrders();}
async function logoutRider(){await supabaseClient.auth.signOut();location.replace('rider-login.html');}
init();
</script>
</body></html>
