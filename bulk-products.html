/* ==============================
   BULK INSERT FUNCTION
============================== */

async function addBulkProducts() {

    const status =
        document.getElementById("status");

    status.innerHTML =
        "Checking existing products...";


    const {
        data: existingProducts,
        error: readError
    } =
    await supabaseClient
        .from("products")
        .select("product_name");


    if (readError) {

        status.innerHTML =
            "Error reading products: "
            + readError.message;

        return;
    }


    const existingNames =
        new Set(
            (existingProducts || [])
            .map(product =>
                product.product_name
                    .trim()
                    .toLowerCase()
            )
        );


    const productsToInsert =
        newProducts.filter(product =>
            !existingNames.has(
                product.product_name
                    .trim()
                    .toLowerCase()
            )
        );


    if (productsToInsert.length === 0) {

        status.innerHTML =
            "All products already exist. Nothing new was added.";

        return;
    }


    status.innerHTML =
        "Adding "
        + productsToInsert.length
        + " new products...";


    const {
        data,
        error
    } =
    await supabaseClient
        .from("products")
        .insert(productsToInsert)
        .select();


    if (error) {

        status.innerHTML =
            "Error: "
            + error.message;

        return;
    }


    const skipped =
        newProducts.length
        - productsToInsert.length;


    status.innerHTML =
        "<b>Done ✅</b><br><br>"
        + productsToInsert.length
        + " new products added.<br>"
        + skipped
        + " duplicate products skipped.<br><br>"
        + "Now open Admin Panel and refresh it.";
}
