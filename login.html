<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Apna Bazaar</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background:
                linear-gradient(135deg, #effff4, #fff5ec);
        }

        .auth-card {
            width: 100%;
            max-width: 430px;
            background: #ffffff;
            border-radius: 22px;
            padding: 35px;
            box-shadow: 0 15px 45px rgba(0,0,0,0.12);
        }

        .logo {
            text-align: center;
            color: #07883f;
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 28px;
        }

        .tabs {
            display: flex;
            background: #f2f4f3;
            padding: 5px;
            border-radius: 12px;
            margin-bottom: 25px;
        }

        .tab {
            width: 50%;
            border: none;
            padding: 12px;
            border-radius: 9px;
            cursor: pointer;
            font-weight: bold;
            background: transparent;
        }

        .tab.active {
            background: #07883f;
            color: white;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #ddd;
            border-radius: 10px;
            outline: none;
            font-size: 15px;
        }

        input:focus {
            border-color: #07883f;
        }

        .main-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #ff6500;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }

        .main-btn:hover {
            opacity: 0.92;
        }

        #nameGroup {
            display: none;
        }

        #message {
            margin-top: 18px;
            text-align: center;
            font-weight: bold;
            line-height: 1.5;
        }

        .back-home {
            text-align: center;
            margin-top: 20px;
        }

        .back-home a {
            color: #07883f;
            text-decoration: none;
            font-weight: bold;
        }

        @media (max-width: 500px) {
            .auth-card {
                padding: 25px 20px;
            }
        }
    </style>
</head>

<body>

<div class="auth-card">

    <div class="logo">Apna Bazaar</div>

    <p class="subtitle">
        Welcome! Login or create your account.
    </p>

    <div class="tabs">
        <button
            id="loginTab"
            class="tab active"
            onclick="showLogin()">
            Login
        </button>

        <button
            id="signupTab"
            class="tab"
            onclick="showSignup()">
            Sign Up
        </button>
    </div>

    <div id="nameGroup" class="form-group">
        <label>Full Name</label>
        <input
            type="text"
            id="fullName"
            placeholder="Enter your full name">
    </div>

    <div class="form-group">
        <label>Email Address</label>
        <input
            type="email"
            id="email"
            placeholder="Enter your email">
    </div>

    <div class="form-group">
        <label>Password</label>
        <input
            type="password"
            id="password"
            placeholder="Enter your password">
    </div>
<div style="text-align: right; margin: 8px 0 14px;">
    <a href="#" onclick="forgotPassword(); return false;" style="color:#07883f; font-size:14px; text-decoration:none; font-weight:600;">
        Forgot Password?
    </a>
</div>
    <button
        id="submitButton"
        class="main-btn"
        onclick="loginUser()">
        Login
    </button>

    <div id="message"></div>

    <div class="back-home">
        <a href="index.html">← Back to Apna Bazaar</a>
    </div>

</div>

<script>

const SUPABASE_URL =
"https://sdycertdcrcxuygunlgf.supabase.co";

const SUPABASE_KEY =
"sb_publishable_IwpL3sk7-mkC65RsO5IX0Q_yn7iMqSO";

const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );

let authMode = "login";

function showLogin() {

    authMode = "login";

    document.getElementById("nameGroup")
        .style.display = "none";

    document.getElementById("loginTab")
        .classList.add("active");

    document.getElementById("signupTab")
        .classList.remove("active");

    const button =
        document.getElementById("submitButton");

    button.textContent = "Login";
    button.onclick = loginUser;

    document.getElementById("message")
        .innerHTML = "";
}


function showSignup() {

    authMode = "signup";

    document.getElementById("nameGroup")
        .style.display = "block";

    document.getElementById("signupTab")
        .classList.add("active");

    document.getElementById("loginTab")
        .classList.remove("active");

    const button =
        document.getElementById("submitButton");

    button.textContent = "Create Account";
    button.onclick = signupUser;

    document.getElementById("message")
        .innerHTML = "";
}


async function signupUser() {

    const fullName =
        document.getElementById("fullName")
        .value.trim();

    const email =
        document.getElementById("email")
        .value.trim();

    const password =
        document.getElementById("password")
        .value;

    const message =
        document.getElementById("message");

    if (!fullName || !email || !password) {
        message.style.color = "red";
        message.textContent =
            "Please complete all fields.";
        return;
    }

    if (password.length < 6) {
        message.style.color = "red";
        message.textContent =
            "Password must be at least 6 characters.";
        return;
    }

    message.style.color = "#555";
    message.textContent =
        "Creating your account...";

    const { data, error } =
        await supabaseClient.auth.signUp({
            email: email,
            password: password,
            options: {
                data: {
                    full_name: fullName
                }
            }
        });

    if (error) {
        message.style.color = "red";
        message.textContent = error.message;
        return;
    }

    message.style.color = "#07883f";
    message.textContent =
        "Account created successfully!";

    setTimeout(function () {
        window.location.href = "index.html";
    }, 1000);
}


async function loginUser() {

    const email =
        document.getElementById("email")
        .value.trim();

    const password =
        document.getElementById("password")
        .value;

    const message =
        document.getElementById("message");

    if (!email || !password) {
        message.style.color = "red";
        message.textContent =
            "Please enter email and password.";
        return;
    }

    message.style.color = "#555";
    message.textContent =
        "Logging in...";

    const { data, error } =
        await supabaseClient.auth
        .signInWithPassword({
            email: email,
            password: password
        });

    if (error) {
        message.style.color = "red";
        message.textContent = error.message;
        return;
    }

    message.style.color = "#07883f";
    message.textContent =
        "Login successful!";
setTimeout(function () {
    const ADMIN_EMAIL = "saifyounas112@gmail.com";

    if (email.toLowerCase() === ADMIN_EMAIL.toLowerCase()) {
        window.location.href = "admin.html";
        return;
    }

    const returnAfterLogin =
        localStorage.getItem("returnAfterLogin");

    if (returnAfterLogin === "checkout") {
        window.location.href = "index.html?resumeCheckout=true";
    } else {
        window.location.href = "index.html";
    }
}, 700);
}
async function forgotPassword() {
    const email = document.getElementById("email").value.trim();
    const message = document.getElementById("message");

    if (!email) {
        message.style.color = "red";
        message.textContent = "Please enter your email address first.";
        return;
    }

    message.style.color = "#07883f";
    message.textContent = "Sending password reset email...";

    const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
       redirectTo: "https://eclectic-kleicha-7eb102.netlify.app/reset-password.html"
    });

    if (error) {
        message.style.color = "red";
        message.textContent = error.message;
        return;
    }

    message.style.color = "#07883f";
    message.textContent = "Password reset link sent. Please check your email.";
}
</script>

</body>
</html>
