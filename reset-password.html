<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Apna Bazaar</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: linear-gradient(135deg, #effff4, #fff8ef);
        }

        .reset-card {
            width: 100%;
            max-width: 430px;
            background: white;
            padding: 42px 35px;
            border-radius: 22px;
            box-shadow: 0 12px 35px rgba(0,0,0,0.10);
        }

        .reset-card h1 {
            color: #07883f;
            text-align: center;
            margin-bottom: 10px;
            font-size: 34px;
        }

        .reset-card .subtitle {
            text-align: center;
            color: #555;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #222;
        }

        .form-group input {
            width: 100%;
            padding: 14px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
        }

        .form-group input:focus {
            border-color: #07883f;
        }

        .reset-btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: #ff6500;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }

        .reset-btn:hover {
            opacity: 0.92;
        }

        #message {
            text-align: center;
            margin-top: 18px;
            font-weight: 600;
            line-height: 1.5;
        }

        .back-login {
            text-align: center;
            margin-top: 22px;
        }

        .back-login a {
            color: #07883f;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="reset-card">

    <h1>Apna Bazaar</h1>

    <p class="subtitle">
        Create your new password
    </p>

    <div class="form-group">
        <label>New Password</label>
        <input
            type="password"
            id="newPassword"
            placeholder="Enter new password"
        >
    </div>

    <div class="form-group">
        <label>Confirm New Password</label>
        <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm new password"
        >
    </div>

    <button
        type="button"
        class="reset-btn"
        onclick="updatePassword()"
    >
        Update Password
    </button>

    <div id="message"></div>

    <div class="back-login">
        <a href="login.html">← Back to Login</a>
    </div>

</div>

<script>

const SUPABASE_URL =
"https://sdycertdcrcxuygunlgf.supabase.co";

const SUPABASE_KEY =
"sb_publishable_IwpL3sk7-mkC65RsO5IX0Q_yn7iMqSO";

const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


async function updatePassword() {

    const newPassword =
        document.getElementById("newPassword").value;

    const confirmPassword =
        document.getElementById("confirmPassword").value;

    const message =
        document.getElementById("message");


    if (!newPassword || !confirmPassword) {

        message.style.color = "red";

        message.textContent =
            "Please enter and confirm your new password.";

        return;
    }


    if (newPassword.length < 6) {

        message.style.color = "red";

        message.textContent =
            "Password must be at least 6 characters.";

        return;
    }


    if (newPassword !== confirmPassword) {

        message.style.color = "red";

        message.textContent =
            "Passwords do not match.";

        return;
    }


    message.style.color = "#07883f";

    message.textContent =
        "Updating password...";


    const { error } =
        await supabaseClient.auth.updateUser({
            password: newPassword
        });


    if (error) {

        message.style.color = "red";

        message.textContent =
            error.message;

        return;
    }


    message.style.color = "#07883f";

    message.textContent =
        "Password updated successfully!";


    setTimeout(function () {

        window.location.href =
            "login.html";

    }, 1500);
}

</script>

</body>
</html>
