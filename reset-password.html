<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Reset Password - Apna Bazaar</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:Arial,sans-serif;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px;background:linear-gradient(135deg,#effff4,#fff8ef)}.card{width:100%;max-width:430px;background:#fff;padding:42px 35px;border-radius:22px;box-shadow:0 12px 35px rgba(0,0,0,.1)}h1{color:#07883f;text-align:center;margin-bottom:10px;font-size:34px}.subtitle{text-align:center;color:#555;margin-bottom:28px}.group{margin-bottom:18px}label{display:block;font-weight:bold;margin-bottom:8px}input{width:100%;padding:14px;border:1px solid #ddd;border-radius:10px;font-size:15px;outline:none}input:focus{border-color:#07883f}.btn{width:100%;padding:15px;border:0;border-radius:10px;background:#ff6500;color:#fff;font-size:17px;font-weight:bold;cursor:pointer}.btn:disabled{opacity:.6}#message{text-align:center;margin-top:18px;font-weight:600;line-height:1.5}.back{text-align:center;margin-top:22px}.back a{color:#07883f;text-decoration:none;font-weight:bold}</style></head><body><div class="card"><h1>Apna Bazaar</h1><p class="subtitle" id="subtitle">Create your new password</p><div class="group"><label>New Password</label><input type="password" id="newPassword" placeholder="Enter new password"></div><div class="group"><label>Confirm New Password</label><input type="password" id="confirmPassword" placeholder="Confirm new password"></div><button class="btn" id="updateBtn" onclick="updatePassword()">Update Password</button><div id="message"></div><div class="back"><a id="backLink" href="login.html">← Back to Login</a></div></div><script>
const SUPABASE_URL='https://sdycertdcrcxuygunlgf.supabase.co';const SUPABASE_KEY='sb_publishable_IwpL3sk7-mkC65RsO5IX0Q_yn7iMqSO';const supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const isAdmin=new URLSearchParams(location.search).get('type')==='admin';if(isAdmin){document.getElementById('subtitle').textContent='Create your new Admin password';document.getElementById('backLink').href='admin-login.html';document.getElementById('backLink').textContent='← Back to Admin Login'}
function show(t,c){const m=document.getElementById('message');m.style.color=c;m.textContent=t}
async function updatePassword(){const p=document.getElementById('newPassword').value,c=document.getElementById('confirmPassword').value,b=document.getElementById('updateBtn');if(!p||!c){show('Please enter and confirm your new password.','red');return}if(p.length<6){show('Password must be at least 6 characters.','red');return}if(p!==c){show('Passwords do not match.','red');return}b.disabled=true;show('Updating password...','#07883f');const {error}=await supabaseClient.auth.updateUser({password:p});b.disabled=false;if(error){show('Password update error: '+error.message,'red');return}show('Password updated successfully!','#07883f');setTimeout(()=>location.href=isAdmin?'admin-login.html':'login.html',1200)}
</script></body></html>
